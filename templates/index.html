<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Divisas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primario: #0f766e;
            --color-secundario: #14b8a6;
            --color-acento: #f59e0b;
            --color-texto: #1f2937;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--color-primario), var(--color-secundario));
            color: var(--color-texto);
        }
        h2 {
            font-weight: 600;
            color: var(--color-primario);
        }
        .form-label {
            font-weight: 500;
        }
        .converter-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 20px;
            background: #ffffff;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--color-secundario);
            box-shadow: 0 0 0 0.25rem rgba(20, 184, 166, 0.25);
        }
        .btn-primary {
            background-color: var(--color-primario);
            border-color: var(--color-primario);
            font-weight: 600;
        }
        .btn-primary:hover, .btn-primary:focus {
            background-color: var(--color-acento);
            border-color: var(--color-acento);
        }
        .result-box {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--color-primario);
        }
        /* Responsive: pantallas pequeñas (móvil) */
        @media (max-width: 576px) {
            .converter-card {
                border-radius: 12px;
                padding: 1.5rem !important;
            }
            h2 {
                font-size: 1.4rem;
            }
            .result-box {
                font-size: 1.25rem;
            }
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center min-vh-100 p-3">

    <div class="card shadow-lg p-4 converter-card">
        <h2 class="text-center mb-4">💱 Conversor de Divisas</h2>

        <form method="post">
            <div class="mb-3">
                <label class="form-label">Cantidad</label>
                <input type="number" step="0.01" name="amount" 
                       class="form-control form-control-lg" 
                       placeholder="Introduce cantidad" required>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <select name="from_currency" class="form-select">
                        <option value="EUR">EUR €</option>
                        <option value="USD">USD $</option>
                        <option value="GBP">GBP £</option>
                    </select>
                </div>
                <div class="col text-center align-self-center">
                    →
                </div>
                <div class="col">
                    <select name="to_currency" class="form-select">
                        <option value="USD">USD $</option>
                        <option value="EUR">EUR €</option>
                        <option value="GBP">GBP £</option>
                    </select>
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                    Convertir
                </button>
            </div>
        </form>

        {% if result is not none %}
            <div class="mt-4 text-center result-box">
                {{ result }}
            </div>
        {% endif %}
    </div>

</body>
</html>
